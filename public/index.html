<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Hot 100 · 50 天刷题计划</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/knowledge.css">
  <script src="/knowledge-data.js" defer></script>
  <script src="/knowledge.js" defer></script>
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">H.</span><span>HOT 100</span></div>
      <a class="knowledge-entry" href="/knowledge"><span>知识库</span><span aria-hidden="true">↗</span></a>
      <p class="side-label">学习路线</p>
      <nav id="stage-nav" aria-label="阶段导航"></nav>
    </aside>

    <main class="main">
      <header class="hero">
        <div class="hero-copy">
          <h1>刷题计划</h1>
          <button id="jump-button" class="primary-button" type="button">继续 Day 01 <span aria-hidden="true">↗</span></button>
        </div>
      </header>

      <section class="overview" aria-label="学习进度">
        <div class="overview-heading"><h2>学习进度</h2><span id="save-status" class="save-status" role="status" hidden></span></div>
        <div class="progress-track" role="progressbar" aria-label="已完成题数" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="progress-fill"></span></div>
        <div class="stats"><div><strong id="done-count">0</strong><span>已完成 / 100</span></div><div><strong id="day-count">0</strong><span>完成天数 / 50</span></div><div><strong id="review-count">0</strong><span>C 题待复习</span></div></div>
      </section>

      <div class="content-heading"><h2>50 天路线图</h2></div>
      <div id="stages" class="stages"></div>
    </main>
  </div>
</body>
</html>
